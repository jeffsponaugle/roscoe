<text x="1005" y="56" font-size="10" fill="#c0392b" text-anchor="middle">/CS0 released</text>
<text x="8" y="558" font-size="11" fill="#555">Proposed. Drawn at 16 MHz (1 slot = 15.6 ns). nIDE_WR is a falling-edge register fed by the counter, so it cannot glitch: low from edge 2 to edge 7, 312 ns. The drive latches the data</text>
<text x="8" y="572" font-size="11" fill="#555">on the rising edge of /IOW, two clocks before AS negates, with /CS0 and the data still valid (t9 113 ns and t4 116 ns at 16 MHz). nIDE_RD_INH stays high in write cycles, so nCPU_RD</text>
<text x="8" y="586" font-size="11" fill="#555">never asserts. IDE2 uses the same strobe; only the selects differ. A fast-window write has /IOW from edge 1 to edge 3 and a 5-clock cycle.</text>
