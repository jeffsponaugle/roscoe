<path d="M813.5,317 L933.5,377" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="933.5,377 928.58,371.19 925.9,376.55" fill="#1f6fb2"/>
<rect x="810" y="337" width="127" height="13" fill="#ffffff" fill-opacity="0.85"/>
<text x="873.5" y="347" font-size="10" fill="#1f6fb2" text-anchor="middle">grant on the next edge</text>
<text x="8" y="558" font-size="11" fill="#555">Proposed. Drawn at 16 MHz (1 slot = 15.6 ns). BUSCTRL decides the VMEM grant on rising CPU_CLK edges, starting with the edge that begins S2: it grants if the card&apos;s nEXP_VMEM_BUSY is high, then holds GNT and DSACK</text>
<text x="8" y="572" font-size="11" fill="#555">until AS negates, so an acknowledge is never withdrawn. Cycle A: the card asks for the memory (BUSY low) on the same edge that grants the CPU. It sees GNT on the next edge, so it leaves the memory on the CPU path</text>
<text x="8" y="586" font-size="11" fill="#555">and waits for GNT to clear; here it starts its fetch on the S2 edge of cycle B (worst case the video side waits 3 clocks). Cycle B: BUSY is low at every decision edge, so the CPU collects wait states while the</text>
<text x="8" y="600" font-size="11" fill="#555">card fetches. The card releases BUSY one clock before its fetch ends; BUSCTRL grants on the next edge and the read completes with 2 wait states. With no card fitted the pull-up keeps BUSY high and every VMEM cycle</text>
<text x="8" y="614" font-size="11" fill="#555">has 0 wait states.</text>
</svg>
