<text x="160" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_CLK</text>
<text x="160" y="111" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">state</text>
<text x="160" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">A31-A0</text>
<text x="160" y="201" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_AS</text>
<text x="160" y="261" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nBFLASH_CE</text>
<text x="160" y="291" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_RD (/OE)</text>
<text x="160" y="321" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_DSACK0</text>
<text x="160" y="351" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_DSACK1</text>
<text x="160" y="411" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">D31-D24 (-55 part)</text>
<text x="160" y="441" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">D31-D24 (-70 part)</text>

<line x1="360" y1="46" x2="360" y2="452" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="360" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled</text>
<line x1="488" y1="59" x2="488" y2="452" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="488" y="56" font-size="10" fill="#c0392b" text-anchor="middle">data latched</text>
<text x="8" y="468" font-size="11" fill="#555">Only DSACK0 is asserted, so the CPU treats the flash as an 8-bit port on D31-D24 and runs four of these cycles per long word. Worst case</text>
<text x="8" y="482" font-size="11" fill="#555">at 20 MHz the flash gets about 62 ns from CE and 32 ns from OE (nCPU_RD) before the latch: an SST39SF040-55 fits, a -70 part does not on</text>
<text x="8" y="496" font-size="11" fill="#555">paper.</text>
