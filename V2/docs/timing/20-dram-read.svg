<text x="226" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_CLK</text>
<text x="226" y="111" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">state</text>
<text x="226" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">A31-A0</text>
<text x="226" y="201" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_AS</text>
<text x="226" y="261" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">DRAM_REGION_ACCESS</text>
<text x="226" y="291" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_ACCESS_RAS</text>
<text x="226" y="321" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">..._RAS_RESET1</text>
<text x="226" y="351" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">..._RAS_RESET2</text>
<text x="226" y="381" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">..._REGION_ACCESS_WAITSTATE</text>
<text x="226" y="441" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_SxA_RAS</text>
<text x="226" y="471" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">DRAM_MUX</text>
<text x="226" y="501" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">DRAM_A11-A0 (157 out)</text>
<text x="226" y="531" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_CAS3..0</text>
<text x="226" y="561" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_WE</text>
<text x="226" y="591" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_DATA_EN (245 DIR)</text>
<text x="226" y="621" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">DRAM DQ</text>
<text x="226" y="681" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">D31-D0</text>
<text x="226" y="711" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_DSACK0/1</text>

<line x1="414" y1="46" x2="414" y2="722" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="414" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled: no</text>
<line x1="534" y1="59" x2="534" y2="722" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="534" y="56" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled: yes</text>
<line x1="654" y1="46" x2="654" y2="722" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="654" y="43" font-size="10" fill="#c0392b" text-anchor="middle">data latched</text>
<text x="8" y="738" font-size="11" fill="#555">RAS falls when DRAM_REGION_ACCESS clocks nDRAM_ACCESS_RAS. DRAM_MUX is clocked by the RAS pins falling, so the row address is held about 2 slots. CAS starts from</text>
<text x="8" y="752" font-size="11" fill="#555">RAS_RESET1 on the first falling edge after RAS, and RAS_RESET2 ends RAS one clock later while CAS stays low until AS negates. DSACK comes from the falling-edge</text>
<text x="8" y="766" font-size="11" fill="#555">WAITSTATE flop, giving 4-clock DRAM cycles. Diagram is schematic (1 slot = 12.5 ns, about one CPLD step); see docs/DRAM.md for the nanosecond budget.</text>
</svg>
