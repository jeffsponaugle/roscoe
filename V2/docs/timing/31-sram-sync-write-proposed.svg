<text x="453" y="56" font-size="10" fill="#c0392b" text-anchor="middle">STERM recognised</text>
<line x1="485" y1="46" x2="485" y2="452" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="485" y="43" font-size="10" fill="#c0392b" text-anchor="middle">write ends (SEL)</text>
<text x="8" y="468" font-size="11" fill="#555">Proposal. A falling-edge flop asserts STERM during S3 for AS-qualified SRAM writes, so the CPU recognises it on the</text>
<text x="8" y="482" font-size="11" fill="#555">next rising edge and the write takes 3 clocks, the same as today. The byte selects end the SRAM write at that same</text>
<text x="8" y="496" font-size="11" fill="#555">rising edge, about 3 slots before AS negates, so the write no longer depends on the 10 ns data hold after AS.</text>
