<text x="8" y="618" font-size="11" fill="#555">Proposal. BUSCTRL decodes STERM, CE and OE for SRAM reads from the address alone, so the first long word meets the S2 rising edge. INTCTRL drives SRAM</text>
<text x="8" y="632" font-size="11" fill="#555">A1:A0 with CPU A3:A2 plus a burst count that advances on each falling edge after a long word is latched, wrapping inside the 16-byte line. CBACK is tied</text>
<text x="8" y="646" font-size="11" fill="#555">low, as in the MC68030 UM 2-1-1-1 example. Four long words take 5 clocks, against 12 today.</text>
