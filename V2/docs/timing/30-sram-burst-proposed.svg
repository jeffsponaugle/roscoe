<text x="189" y="531" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">SRAM A1:A0 = A3:A2 + C</text>
<text x="189" y="591" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">D31-D0 (SRAM)</text>

