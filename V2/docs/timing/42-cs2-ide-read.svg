<text x="913" y="56" font-size="10" fill="#c0392b" text-anchor="middle">latched, /IOR off</text>
<line x1="953" y1="46" x2="953" y2="542" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="953" y="43" font-size="10" fill="#c0392b" text-anchor="middle">/CS0 released</text>
<text x="8" y="558" font-size="11" fill="#555">Proposed. Drawn at 16 MHz (1 slot = 15.6 ns). DEVMAP&apos;s thermometer counter steps on each falling edge after AS. nIDE_RD_INH is low for the first clock and again from T8, and</text>
<text x="8" y="572" font-size="11" fill="#555">BUSCTRL&apos;s nCPU_RD flop samples it on falling edges, so /IOR is low from edge 2 to edge 9: 437 ns at 16 MHz. DEVMAP acknowledges at T7, so the CPU sees DSACK1 on edge 8 and</text>
<text x="8" y="586" font-size="11" fill="#555">latches the data on edge 9, the same edge that ends /IOR. The IDEH flop keeps /CS0 asserted until the next rising edge, after /IOR has risen, while the data transceivers turn</text>
<text x="8" y="600" font-size="11" fill="#555">off with AS. A fast-window read (0x4000_0800) uses the same logic with T3 and T2 for a 5-clock cycle.</text>
</svg>
