<text x="947" y="56" font-size="10" fill="#c0392b" text-anchor="middle">AS negates</text>
<text x="8" y="588" font-size="11" fill="#555">Proposal. BUSCTRL never asserts DSACK combinationally for the device regions: DEV_SEEN waits one falling edge, then DEV_ACK samples nDEV_WAIT on each falling edge, so a request that</text>
<text x="8" y="602" font-size="11" fill="#555">arrives late can no longer race the CPU. DEVMAP counts falling edges during an IDE select, keeps nDEV_WAIT low until the count expires and places /IOW inside the cycle. Shown with /IOW</text>
<text x="8" y="616" font-size="11" fill="#555">= 3 clocks (150 ns) and an 8-clock cycle at 20 MHz; the compare values set the ATA PIO timing. /IOR stays on nCPU_RD and so covers the whole cycle from S3.</text>
</svg>
