<text x="189" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_CLK</text>
<text x="189" y="111" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU bus</text>
<text x="189" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">vINT6A (PTC nINTA_OUT)</text>
<text x="189" y="201" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">INT6A_REQUEST</text>
<text x="189" y="231" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">INT6A_REQUEST_LATCHED</text>
<text x="189" y="261" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">INTL6_REQUEST_PE</text>
<text x="189" y="291" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_IPL2..0</text>
<text x="189" y="351" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">FC2-0 A19-A16 A3-A1</text>
<text x="189" y="381" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_AS</text>
<text x="189" y="411" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nINT_ACK_CYCLE</text>
<text x="189" y="441" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">INT_ACK_LEVEL2..0</text>
<text x="189" y="471" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">D31-D24 (INTCTRL out)</text>
<text x="189" y="501" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_DSACK0</text>
<text x="189" y="561" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">INT_ACK_RESET_PRE</text>
<text x="189" y="591" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">INT_ACK_RESET</text>

<line x1="629" y1="46" x2="629" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="629" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled</text>
<line x1="725" y1="59" x2="725" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="725" y="56" font-size="10" fill="#c0392b" text-anchor="middle">vector latched</text>
<text x="8" y="618" font-size="11" fill="#555">The request is re-timed twice (rising edge into *_LATCHED, falling edge into INTLx_REQUEST_PE) before it reaches CPU_IPL on a rising edge, so IPL changes about two clocks after</text>
<text x="8" y="632" font-size="11" fill="#555">the source. During the acknowledge, BUSCTRL decodes FC=7/A19-A16=F as nINT_ACK_CYCLE and returns an 8-bit DSACK0. INTCTRL latches A3-A1 and drives the vector {1, level, source</text>
<text x="8" y="646" font-size="11" fill="#555">bits} on D31-D24. INT_ACK_RESET, a pulse of about one clock after the cycle, clears the edge-triggered flop that was acknowledged.</text>
