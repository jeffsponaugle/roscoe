<path d="M589,159 L592,175 H789" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M789,175 L792,159 H989" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M189,235 H539" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M539,235 L542,219 H989" fill="none" stroke="#222222" stroke-width="1.5"/>
</g>
<text x="181" y="51" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">PTCB_CLOCK</text>
<text x="181" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">PTCB_TIMER[11:0]</text>
<text x="181" y="111" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">selected bit N</text>
<text x="181" y="141" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nINTB_OUT (vINT6B)</text>
<text x="181" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nINTB_OUT_DELAYED</text>
<text x="181" y="231" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">INT6B_REQUEST (INTCTRL)</text>

<path d="M490.5,137 L590.5,167" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="590.5,167 584.66,162.12 582.93,167.86" fill="#1f6fb2"/>
<rect x="504.5" y="142" width="72" height="13" fill="#ffffff" fill-opacity="0.85"/>
<text x="540.5" y="152" font-size="10" fill="#1f6fb2" text-anchor="middle">falling edge</text>
<path d="M590.5,167 C690.5,167 690.5,167 790.5,167" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="790.5,167 783.5,164 783.5,170" fill="#1f6fb2"/>
<text x="8" y="258" font-size="11" fill="#555">The selected counter bit drives nINTx_OUT low. On the next falling PTCB_CLOCK edge nINTx_OUT_DELAYED goes low and asynchronously clears the counter, which ends the</text>
<text x="8" y="272" font-size="11" fill="#555">pulse, and the edge after that releases the counter. INTCTRL triggers on the falling edge of vINT6A/6B, so each period produces one level-6 request; it is cleared by</text>
<text x="8" y="286" font-size="11" fill="#555">the acknowledge. Timer A counts the 32.768 kHz clock, but its pulse is also timed by PTCB_CLOCK.</text>
</svg>
