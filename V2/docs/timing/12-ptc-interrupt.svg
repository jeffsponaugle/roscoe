<line x1="389" y1="32" x2="389" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<line x1="439" y1="32" x2="439" y2="242" stroke="#ececec" stroke-width="1"/>
<line x1="489" y1="32" x2="489" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<line x1="539" y1="32" x2="539" y2="242" stroke="#ececec" stroke-width="1"/>
<line x1="589" y1="32" x2="589" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<line x1="639" y1="32" x2="639" y2="242" stroke="#ececec" stroke-width="1"/>
<line x1="689" y1="32" x2="689" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<line x1="739" y1="32" x2="739" y2="242" stroke="#ececec" stroke-width="1"/>
<line x1="789" y1="32" x2="789" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<line x1="839" y1="32" x2="839" y2="242" stroke="#ececec" stroke-width="1"/>
<line x1="889" y1="32" x2="889" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<line x1="939" y1="32" x2="939" y2="242" stroke="#ececec" stroke-width="1"/>
<line x1="989" y1="32" x2="989" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<g clip-path="url(#wave)">
<path d="M189,55 V39 H239 V55 H289 M289,55 V39 H339 V55 H389 M389,55 V39 H439 V55 H489 M489,55 V39 H539 V55 H589 M589,55 V39 H639 V55 H689 M689,55 V39 H739 V55 H789 M789,55 V39 H839 V55 H889 M889,55 V39 H939 V55 H989" fill="none" stroke="#222222" stroke-width="1.5"/>
<polygon points="189,69 586,69 589,77 586,85 189,85" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="389" y="80.96" font-size="11" fill="#222222" text-anchor="middle">counting up to bit N</text>
<polygon points="589,77 592,69 786,69 789,77 786,85 592,85" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="689" y="80.96" font-size="11" fill="#222222" text-anchor="middle">held at 0</text>
<polygon points="789,77 792,69 989,69 989,85 792,85" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="889" y="80.96" font-size="11" fill="#222222" text-anchor="middle">0, 1, 2 ...</text>
<path d="M189,115 H439" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M439,115 L442,99 H639" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M639,99 L642,115 H989" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M189,129 H489" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M489,129 L492,145 H689" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M689,145 L692,129 H989" fill="none" stroke="#222222" stroke-width="1.5"/>
