<svg xmlns="http://www.w3.org/2000/svg" width="1003" height="300" viewBox="0 0 1003 300" font-family="Helvetica, Arial, sans-serif">
<title>12-ptc-interrupt</title>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="5" stroke="#b0b0b0" stroke-width="1.4"/></pattern>
<clipPath id="wave"><rect x="189" y="0" width="800" height="300"/></clipPath>
</defs>
<rect width="1003" height="300" fill="#ffffff"/>
<text x="8" y="22" font-size="14" font-weight="bold" fill="#222222">PTC interrupt pulse (timer B shown; PTCB_CLOCK = CPU_CLK / 16)</text>
<line x1="189" y1="32" x2="189" y2="242" stroke="#d5d5d5" stroke-width="1"/>
<line x1="239" y1="32" x2="239" y2="242" stroke="#ececec" stroke-width="1"/>
<line x1="289" y1="32" x2="289" y2="242" stroke="#d5d5d5" stroke-width="1"/>
