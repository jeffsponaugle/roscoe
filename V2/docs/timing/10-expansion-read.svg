<text x="226" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_CLK</text>
<text x="226" y="111" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">state</text>
<text x="226" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">EXP_A31-A0</text>
<text x="226" y="201" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">EXP_RW</text>
<text x="226" y="231" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nEXP_CPU_AS</text>
<text x="226" y="261" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nEXP_32BDEV</text>
<text x="226" y="321" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nEXP_DATA_EN (driven high)</text>
<text x="226" y="351" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nEXP_DATA_EN (pull-up only)</text>
<text x="226" y="381" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">EXP_D31-D0 (card)</text>
<text x="226" y="411" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nEXP_DEV_WAIT</text>
<text x="226" y="471" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">D31-D0 (via U54-U57)</text>
<text x="226" y="501" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_DSACK0/1</text>

<line x1="426" y1="46" x2="426" y2="512" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="426" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled</text>
<line x1="554" y1="59" x2="554" y2="512" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="554" y="56" font-size="10" fill="#c0392b" text-anchor="middle">data latched</text>
<line x1="810" y1="46" x2="810" y2="512" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="810" y="43" font-size="10" fill="#c0392b" text-anchor="middle">next cycle may drive D31-D0</text>
<text x="8" y="528" font-size="11" fill="#555">BUSCTRL acknowledges the whole 8/16/32-bit region two levels after AS, so a card gets no wait states whatever it does with nEXP_DEV_WAIT. It has</text>
<text x="8" y="542" font-size="11" fill="#555">about 4 slots (50 ns at 20 MHz) from nEXP_xxBDEV to valid data at the connector. U54-U57 are always enabled and nEXP_DATA_EN only sets their</text>
<text x="8" y="556" font-size="11" fill="#555">direction. A card must drive it high again as soon as its select ends: with only the 10K pull-up the buffers keep driving the CPU data bus into the</text>
<text x="8" y="570" font-size="11" fill="#555">next cycle.</text>
</svg>
