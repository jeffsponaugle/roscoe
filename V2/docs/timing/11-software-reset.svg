<line x1="870" y1="62" x2="870" y2="332" stroke="#ececec" stroke-width="1"/>
<line x1="934" y1="62" x2="934" y2="332" stroke="#d5d5d5" stroke-width="1"/>
<g clip-path="url(#wave)">
<path d="M166,85 V69 H230 V85 H294 M294,85 V69 H358 V85 H422 M422,85 V69 H486 V85 H550 M550,85 V69 H614 V85 H678 M678,85 V69 H742 V85 H806 M806,85 V69 H870 V85 H934" fill="none" stroke="#222222" stroke-width="1.5"/>
<polygon points="166,99 227,99 230,107 227,115 166,115" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="198" y="110.96" font-size="11" fill="#222222" text-anchor="middle">S0</text>
<polygon points="230,107 233,99 291,99 294,107 291,115 233,115" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="262" y="110.96" font-size="11" fill="#222222" text-anchor="middle">S1</text>
<polygon points="294,107 297,99 355,99 358,107 355,115 297,115" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="326" y="110.96" font-size="11" fill="#222222" text-anchor="middle">S2</text>
<polygon points="358,107 361,99 419,99 422,107 419,115 361,115" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="390" y="110.96" font-size="11" fill="#222222" text-anchor="middle">S3</text>
<polygon points="422,107 425,99 483,99 486,107 483,115 425,115" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="454" y="110.96" font-size="11" fill="#222222" text-anchor="middle">S4</text>
<polygon points="486,107 489,99 934,99 934,115 489,115" fill="#cfe6ff" stroke="#222222" stroke-width="1.2"/>
<text x="710" y="110.96" font-size="11" fill="#222222" text-anchor="middle">CPU bus cycle cut short</text>
<path d="M166,159 H262" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M262,159 L265,175 H486" fill="none" stroke="#222222" stroke-width="1.5"/>
<polygon points="486,175 489,159 934,159 934,175 486,175" fill="url(#hatch)" stroke="#222222" stroke-width="1.2"/>
<path d="M166,189 H326" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M326,189 L329,205 H422" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M422,205 L425,189 H934" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M166,235 H454" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M454,235 L457,219 H518" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M518,219 L521,235 H934" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M166,249 H486" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M486,249 L489,265 H646" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M646,265 L649,249 H934" fill="none" stroke="#222222" stroke-width="1.5"/>
