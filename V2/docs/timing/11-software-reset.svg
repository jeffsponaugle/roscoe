<svg xmlns="http://www.w3.org/2000/svg" width="948" height="390" viewBox="0 0 948 390" font-family="Helvetica, Arial, sans-serif">
<title>11-software-reset</title>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="5" stroke="#b0b0b0" stroke-width="1.4"/></pattern>
