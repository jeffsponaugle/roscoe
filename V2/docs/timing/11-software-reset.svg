<path d="M518,295 L521,279 H678" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M678,279 L681,295 H934" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M166,309 H518" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M518,309 L521,325 H678" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M678,325 L681,309 H934" fill="none" stroke="#222222" stroke-width="1.5"/>
</g>
<text x="158" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_CLK</text>
<text x="158" y="111" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">state</text>
<text x="158" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_AS</text>
<text x="158" y="201" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nINTCTRL_CS</text>
<text x="158" y="231" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">RESET_CONTROL_OUT</text>
<text x="158" y="261" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nSYS_RESET</text>
<text x="158" y="291" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">SYS_RESET_POS (UART)</text>
<text x="158" y="321" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">IDE /RESET</text>

<line x1="422" y1="46" x2="422" y2="332" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="422" y="43" font-size="10" fill="#c0392b" text-anchor="middle">INTCTRL latches bit 1</text>
<line x1="614" y1="59" x2="614" y2="332" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="614" y="56" font-size="10" fill="#c0392b" text-anchor="middle">falling edge releases reset</text>
<path d="M455.5,227 L487.5,257" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="487.5,257 484.45,250.02 480.34,254.4" fill="#1f6fb2"/>
<path d="M487.5,257 L519.5,227" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="519.5,227 512.34,229.6 516.45,233.98" fill="#1f6fb2"/>
<path d="M519.5,227 C583.5,227 583.5,257 647.5,257" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="647.5,257 640.5,254 640.5,260" fill="#1f6fb2"/>
<rect x="533.75" y="232" width="99.5" height="13" fill="#ffffff" fill-opacity="0.85"/>
<text x="583.5" y="242" font-size="10" fill="#1f6fb2" text-anchor="middle">next falling edge</text>
<text x="8" y="348" font-size="11" fill="#555">RESET_CONTROL_OUT forces nSYS_RESET low asynchronously in BUSCTRL, but INTCTRL clears RESET_CONTROL_OUT with that same nSYS_RESET, so reset ends at the next</text>
<text x="8" y="362" font-size="11" fill="#555">falling CPU_CLK edge. The pulse is about one clock long. The MC68030 needs RESET for at least 10 clocks to reset its logic (520 recommended), and ATA devices</text>
<text x="8" y="376" font-size="11" fill="#555">need 25 us.</text>
</svg>
