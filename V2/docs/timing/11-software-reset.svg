</defs>
<rect width="948" height="390" fill="#ffffff"/>
<text x="8" y="22" font-size="14" font-weight="bold" fill="#222222">Software reset (write bit 1 of 0x30000202) - the reset pulse cancels itself</text>
<line x1="166" y1="62" x2="166" y2="332" stroke="#d5d5d5" stroke-width="1"/>
<line x1="230" y1="62" x2="230" y2="332" stroke="#ececec" stroke-width="1"/>
