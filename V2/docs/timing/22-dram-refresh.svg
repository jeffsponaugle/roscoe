<text x="204" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_CLK</text>
<text x="204" y="141" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">REFRESH_REQUESTED</text>
<text x="204" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">REFRESH_ACTIVE</text>
<text x="204" y="201" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">REFRESH_STATE_MACHINE</text>
<text x="204" y="231" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nREFRESH_CAS</text>
<text x="204" y="261" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nREFRESH_RAS</text>
<text x="204" y="291" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">REFRESH_COMPLETE</text>
<text x="204" y="321" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">REFRESH_COMPLETE_DELAY</text>
<text x="204" y="381" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_AS</text>
<text x="204" y="411" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">DRAM_REGION_ACCESS</text>
<text x="204" y="441" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_DSACK0/1</text>
<text x="204" y="501" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_S1A_RAS (accessed)</text>
<text x="204" y="531" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_S2A..S4B_RAS</text>
<text x="204" y="561" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_CAS3..0</text>
<text x="204" y="591" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nDRAM_WE</text>

<line x1="308" y1="46" x2="308" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="308" y="43" font-size="10" fill="#c0392b" text-anchor="middle">AS high: refresh starts</text>
<line x1="644" y1="59" x2="644" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="644" y="56" font-size="10" fill="#c0392b" text-anchor="middle">RAS after CAS (CBR)</text>
<line x1="884" y1="46" x2="884" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="884" y="43" font-size="10" fill="#c0392b" text-anchor="middle">ACTIVE cleared</text>
<line x1="1028" y1="59" x2="1028" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1028" y="56" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled</text>
<line x1="1124" y1="46" x2="1124" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1124" y="43" font-size="10" fill="#c0392b" text-anchor="middle">data latched</text>
<text x="8" y="618" font-size="11" fill="#555">REFRESH_ACTIVE is set on a rising edge where AS is high, so a refresh never starts inside a bus cycle. While it is set, DRAM_REGION_ACCESS is held off, and a DRAM cycle that starts meanwhile just collects wait</text>
<text x="8" y="632" font-size="11" fill="#555">states. The state machine counts falling edges: CAS is low in states 1-3 and RAS (all eight rank selects) in states 3-4. COMPLETE resets the machine, and COMPLETE_DELAY clears ACTIVE on the next falling edge, which</text>
<text x="8" y="646" font-size="11" fill="#555">lets the waiting access start.</text>
</svg>
