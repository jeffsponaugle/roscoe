<line x1="352" y1="46" x2="352" y2="452" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="352" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled</text>
<line x1="416" y1="59" x2="416" y2="452" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="416" y="56" font-size="10" fill="#c0392b" text-anchor="middle">mask register clocks</text>
<text x="8" y="468" font-size="11" fill="#555">The INTCTRL registers are clocked by the rising edge of (nINTCTRL_CS OR R/W OR address). DEVMAP&apos;s nINTCTRL_CS_delay flop ends the chip</text>
<text x="8" y="482" font-size="11" fill="#555">select at the first falling clock edge of a write, so the edge lands mid-cycle while the CPU is still driving the data. The same</text>
<text x="8" y="496" font-size="11" fill="#555">pattern would help the PTC and the 7-segment latches, which are clocked at the end of the cycle.</text>
