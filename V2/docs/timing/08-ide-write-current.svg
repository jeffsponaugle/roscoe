<text x="616" y="56" font-size="10" fill="#c0392b" text-anchor="middle">CS0 high, buffers off</text>
<line x1="648" y1="46" x2="648" y2="602" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="648" y="43" font-size="10" fill="#c0392b" text-anchor="middle">/IOW rises</text>
<path d="M617.5,557 L649.5,527" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="649.5,527 642.34,529.6 646.45,533.98" fill="#1f6fb2"/>
<text x="8" y="618" font-size="11" fill="#555">nIDE_WR = CPU_RW OR NOT IDE_WR_SIG. IDE_WR_SIG is armed by the first falling edge after the IDE1 select and sets on the next rising</text>
<text x="8" y="632" font-size="11" fill="#555">edge. With no wait states it only clears when R/W changes in the next cycle or the select goes away, so /IOW rises after /CS0 and after</text>
<text x="8" y="646" font-size="11" fill="#555">the data buffers are disabled. ATA latches on the rising edge of /IOW and needs CS and data held after it. IDE_WR_SIG_A and the</text>
<text x="8" y="660" font-size="11" fill="#555">wait-state clock only look at nIDE1_CSA/CSB, so IDE2 writes never produce /IOW.</text>
