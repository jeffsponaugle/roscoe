<text x="8" y="528" font-size="11" fill="#555">Proposed. DEVMAP gets AS directly (rework wire) and BUSCTRL&apos;s region select early (address only), so device selects follow AS by one CPLD level. A</text>
<text x="8" y="542" font-size="11" fill="#555">falling-edge counter starts with AS. nDEV_ACK stays high (not ready) until the selected device&apos;s count is reached; for the RTC that is count 2, giving 2 wait</text>
<text x="8" y="556" font-size="11" fill="#555">states. UART, INTCTRL, LEDs and PTC acknowledge at count 0 (no wait states). Cards acknowledge through nEXP_ACK. BUSCTRL turns nDEV_ACK into DSACK and never</text>
<text x="8" y="570" font-size="11" fill="#555">retracts it.</text>
</svg>
