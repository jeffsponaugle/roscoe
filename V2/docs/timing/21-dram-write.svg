<line x1="467" y1="46" x2="467" y2="542" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="467" y="43" font-size="10" fill="#c0392b" text-anchor="middle">CAS falls: data written</text>
<line x1="617" y1="59" x2="617" y2="542" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="617" y="56" font-size="10" fill="#c0392b" text-anchor="middle">S4 ends</text>
<text x="8" y="558" font-size="11" fill="#555">nDRAM_WE falls with DRAM_REGION_ACCESS, well before CAS, so the SIMMs see an early-write cycle and keep their outputs off. Byte lanes come from the same</text>
<text x="8" y="572" font-size="11" fill="#555">BA32 terms as the SRAM selects: unwritten lanes simply never get CAS. The 74HC245s face the DRAM by default (nDRAM_DATA_EN = 0), so the write data reaches</text>
<text x="8" y="586" font-size="11" fill="#555">the SIMMs about one buffer delay after the CPU drives it.</text>
