<text x="382" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled</text>
<line x1="510" y1="59" x2="510" y2="512" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="510" y="56" font-size="10" fill="#c0392b" text-anchor="middle">data latched</text>
<text x="8" y="528" font-size="11" fill="#555">The RTC runs in Motorola mode (MOT tied high). Its address strobe falls with nRTC_CS while U34 drives CPU A7-A0, so each RTC register is</text>
<text x="8" y="542" font-size="11" fill="#555">directly addressable at 0x30000300 + n. On the first falling clock edge RTC_A_SEL turns U34 off, raises DS and enables U35 towards D31-D24.</text>
<text x="8" y="556" font-size="11" fill="#555">With no wait states, DS is high for only about one clock (50 ns at 20 MHz). Check that against the DS12887 bus-timing table (not in</text>
<text x="8" y="570" font-size="11" fill="#555">datasheets/) if RTC accesses misbehave.</text>
</svg>
