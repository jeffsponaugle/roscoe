<text x="8" y="558" font-size="11" fill="#555">Proposed. Drawn at 16 MHz (1 slot = 15.6 ns). A11 = 1 selects the fast timing: /IOR (nCPU_RD) is low from edge 1 to edge 4 (187 ns), DEVMAP</text>
<text x="8" y="572" font-size="11" fill="#555">acknowledges at T2, and the cycle takes 5 clocks (312 ns). That meets PIO mode 2 for 16-bit transfers at 12 and 16 MHz. Use the fast window for the</text>
<text x="8" y="586" font-size="11" fill="#555">Data register only: the 8-bit registers need the base window&apos;s 290 ns strobes. A fast write has /IOW from edge 1 to edge 3.</text>
