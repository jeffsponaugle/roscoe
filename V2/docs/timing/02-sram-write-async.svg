<text x="219" y="81" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_CLK</text>
<text x="219" y="111" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">state</text>
<text x="219" y="171" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">A31-A0 FC SIZ</text>
<text x="219" y="201" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">CPU_RW (SRAM /WE)</text>
<text x="219" y="231" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_AS</text>
<text x="219" y="261" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">D31-D0 (CPU out)</text>
<text x="219" y="321" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nSRAM_LH_SEL (written)</text>
<text x="219" y="351" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nSRAM_UH_SEL (not written)</text>
<text x="219" y="381" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nSRAM_BANKx_CE</text>
<text x="219" y="411" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">nCPU_DSACK0/1</text>
<text x="219" y="471" font-size="12" font-family="Consolas, Menlo, monospace" fill="#222222" text-anchor="end">SRAM write (CE.WE.BE)</text>

<line x1="419" y1="46" x2="419" y2="482" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="419" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK sampled</text>
<line x1="579" y1="59" x2="579" y2="482" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="579" y="56" font-size="10" fill="#c0392b" text-anchor="middle">AS negated</text>
<line x1="611" y1="46" x2="611" y2="482" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="611" y="43" font-size="10" fill="#c0392b" text-anchor="middle">CE rises: write ends</text>
<text x="8" y="498" font-size="11" fill="#555">SRAM /WE is CPU_RW itself and the byte selects do not include AS, so the write is CE-controlled: it begins when nSRAM_BANKx_CE falls and ends when</text>
<text x="8" y="512" font-size="11" fill="#555">CE rises, one CPLD delay after AS negates. The 68030 only guarantees write data for 10 ns after AS negates (#25 at 20 MHz), so the end of the</text>
<text x="8" y="526" font-size="11" fill="#555">write relies on the data bus holding its charge.</text>
