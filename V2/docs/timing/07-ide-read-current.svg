<text x="374" y="43" font-size="10" fill="#c0392b" text-anchor="middle">DSACK1 sampled: 0 wait states</text>
<line x1="502" y1="59" x2="502" y2="632" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="502" y="56" font-size="10" fill="#c0392b" text-anchor="middle">data latched</text>
<path d="M407.5,467 L471.5,287" fill="none" stroke="#1f6fb2" stroke-width="1.2"/>
<polygon points="471.5,287 466.33,292.59 471.98,294.6" fill="#1f6fb2"/>
<rect x="414.5" y="367" width="50" height="13" fill="#ffffff" fill-opacity="0.85"/>
<text x="439.5" y="377" font-size="10" fill="#1f6fb2" text-anchor="middle">too late</text>
<text x="8" y="648" font-size="11" fill="#555">BUSCTRL asserts DSACK1 for the whole 16-bit region two CPLD levels after AS. DEVMAP only raises nDEV_WAIT after decoding the IDE select</text>
<text x="8" y="662" font-size="11" fill="#555">and clocking a flop, so BUSCTRL tries to retract an already-asserted open-collector DSACK1 after the CPU has sampled it. The cycle ends</text>
<text x="8" y="676" font-size="11" fill="#555">with no wait states: /IOR is about one clock long and the drive has well under 50 ns to put data on the bus. The DEVMAP wait flop then</text>
<text x="8" y="690" font-size="11" fill="#555">stays set into the next bus cycle.</text>
